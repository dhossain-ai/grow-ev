name = "grow-ev-voice"
main = "src/index.ts"
compatibility_date = "2026-10-10"
workers_dev = true
preview_urls = false

[ai]
binding = "AI"
remote = true

[[ratelimits]]
name = "VOICE_RATE_LIMIT"
namespace_id = "1014"
simple = { limit = 5, period = 60 }

[[durable_objects.bindings]]
name = "VOICE_BUDGET"
class_name = "VoiceBudget"

[[migrations]]
tag = "task014-v1"
new_sqlite_classes = ["VoiceBudget"]

[observability]
enabled = false
