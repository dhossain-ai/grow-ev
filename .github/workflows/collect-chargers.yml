name: Collect Chargers

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Read-only preflight, or one explicitly approved collector poll'
        type: choice
        options:
          - preflight
          - collect
        default: preflight
  # Prepared 30-minute off-the-hour cadence (twice per 60m freshness threshold)
  # Do not activate until user approves the cadence.
  # schedule:
  #   - cron: '14,44 * * * *'

concurrency:
  group: collect-chargers
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GROW_EV_PROJECT_REF: heafsrqaytsfthfcxmqu
      GROW_EV_DATABASE_CA_FILE: /tmp/grow-ev-supabase-ca.crt
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: services/ingestion/package-lock.json

      - name: Install dependencies
        working-directory: services/ingestion
        run: npm ci

      - name: Reconstruct database certificate
        env:
          GROW_EV_DATABASE_CA: ${{ secrets.GROW_EV_DATABASE_CA }}
          GROW_EV_DATABASE_URL: ${{ secrets.GROW_EV_DATABASE_URL }}
        run: |
          if [ -z "$GROW_EV_DATABASE_URL" ] || [ -z "$GROW_EV_DATABASE_CA" ]; then
            echo 'Required collector secrets are missing.' >&2
            exit 1
          fi
          umask 077
          printf '%s\n' "$GROW_EV_DATABASE_CA" > "$GROW_EV_DATABASE_CA_FILE"

      - name: Read-only DEV preflight
        working-directory: services/ingestion
        env:
          GROW_EV_DATABASE_URL: ${{ secrets.GROW_EV_DATABASE_URL }}
        run: npm run preflight

      - name: Run OCPI Collector
        if: ${{ github.event_name == 'schedule' || inputs.mode == 'collect' }}
        working-directory: services/ingestion
        env:
          GROW_EV_DATABASE_URL: ${{ secrets.GROW_EV_DATABASE_URL }}
        run: npm run collect

      - name: Cleanup certificate
        if: always()
        run: rm -f "$GROW_EV_DATABASE_CA_FILE"
