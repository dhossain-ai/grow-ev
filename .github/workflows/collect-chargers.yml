name: Collect Chargers
run-name: ${{ inputs.mode == 'permanent' && format('Permanent collection / {0}', inputs.dispatch_id) || 'Collect Chargers' }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Read-only preflight, or one explicitly approved collector poll'
        type: choice
        options:
          - preflight
          - collect
          - permanent
        default: preflight
      dispatch_id:
        description: 'Cloudflare slot identifier (permanent mode only)'
        type: string
        default: ''
  # Approved hackathon window; scheduled work expires at 2026-10-11 07:00 UTC.
  schedule:
    - cron: '14,44 * * * *'

concurrency:
  group: collect-chargers
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GROW_EV_PROJECT_REF: heafsrqaytsfthfcxmqu
      GROW_EV_DATABASE_CA_FILE: /tmp/grow-ev-supabase-ca.crt
      GROW_EV_PERMANENT_COLLECTION: ${{ vars.GROW_EV_PERMANENT_COLLECTION }}
      GROW_EV_COLLECTION_MODE: ${{ inputs.mode }}
      GROW_EV_HISTORY_ENABLED: ${{ vars.GROW_EV_HISTORY_ENABLED }}
      GROW_EV_SCHEDULER: ${{ vars.GROW_EV_SCHEDULER }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Check collection window before setup or private access
        id: window
        run: |
          if bash .github/scripts/collection-window.sh "$GITHUB_EVENT_NAME"; then
            echo 'allowed=true' >> "$GITHUB_OUTPUT"
          else
            if [ "$GROW_EV_COLLECTION_MODE" = permanent ]; then
              echo 'Permanent activation gate rejected; no work performed.' >&2
              exit 1
            fi
            echo 'allowed=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.window.outputs.allowed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: services/ingestion/package-lock.json

      - name: Install dependencies
        if: steps.window.outputs.allowed == 'true'
        working-directory: services/ingestion
        run: |
          if bash ../../.github/scripts/collection-window.sh "$GITHUB_EVENT_NAME"; then
            npm ci
          fi

      - name: Reconstruct database certificate
        if: steps.window.outputs.allowed == 'true'
        env:
          GROW_EV_DATABASE_CA: ${{ secrets.GROW_EV_DATABASE_CA }}
          GROW_EV_DATABASE_URL: ${{ secrets.GROW_EV_DATABASE_URL }}
        run: |
          if [ -z "$GROW_EV_DATABASE_URL" ] || [ -z "$GROW_EV_DATABASE_CA" ]; then
            echo 'Required collector secrets are missing.' >&2
            exit 1
          fi
          umask 077
          printf '%s' "$GROW_EV_DATABASE_CA" > "$GROW_EV_DATABASE_CA_FILE"

      - name: Read-only DEV preflight
        if: steps.window.outputs.allowed == 'true'
        working-directory: services/ingestion
        env:
          GROW_EV_DATABASE_URL: ${{ secrets.GROW_EV_DATABASE_URL }}
        run: |
          if bash ../../.github/scripts/collection-window.sh "$GITHUB_EVENT_NAME"; then
            npm run preflight
          fi

      - name: Run OCPI Collector
        id: collector
        if: ${{ steps.window.outputs.allowed == 'true' && (github.event_name == 'schedule' || inputs.mode == 'collect' || inputs.mode == 'permanent') }}
        working-directory: services/ingestion
        env:
          GROW_EV_DATABASE_URL: ${{ secrets.GROW_EV_DATABASE_URL }}
          GROW_EV_COLLECTION_RECEIPT: ${{ inputs.mode == 'permanent' && '/tmp/grow-ev-collection-receipt.json' || '' }}
          GROW_EV_DISPATCH_ID: ${{ inputs.dispatch_id }}
        run: |
          if bash ../../.github/scripts/collection-window.sh "$GITHUB_EVENT_NAME"; then
            npm run collect
          fi

      - name: Verify durable private archive
        if: inputs.mode == 'permanent' && steps.collector.outcome == 'success'
        working-directory: services/ingestion
        env:
          GROW_EV_DATABASE_URL: ${{ secrets.GROW_EV_DATABASE_URL }}
          GROW_EV_ARCHIVE_SERVICE_KEY: ${{ secrets.GROW_EV_ARCHIVE_SERVICE_KEY }}
          GROW_EV_HISTORY_PRUNE: ${{ vars.GROW_EV_HISTORY_PRUNE }}
          GROW_EV_COLLECTION_RECEIPT: /tmp/grow-ev-collection-receipt.json
        run: node scripts/archive-history.ts

      - name: Chain CatBoost dry-run for this exact poll
        if: inputs.mode == 'permanent' && steps.collector.outcome == 'success' && vars.GROW_EV_INFERENCE_CHAIN == 'approved'
        env:
          GROW_EV_AI_DISPATCH_TOKEN: ${{ secrets.GROW_EV_AI_DISPATCH_TOKEN }}
          GROW_EV_COLLECTION_RECEIPT: /tmp/grow-ev-collection-receipt.json
        run: node .github/scripts/dispatch-inference.mjs

      - name: Preserve collection receipt
        if: inputs.mode == 'permanent' && steps.collector.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: collection-receipt-${{ github.run_id }}
          path: /tmp/grow-ev-collection-receipt.json
          if-no-files-found: error
          retention-days: 7

      - name: Cleanup certificate
        if: always()
        run: rm -f "$GROW_EV_DATABASE_CA_FILE"
