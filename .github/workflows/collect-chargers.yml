name: Collect Chargers

on:
  workflow_dispatch:
  # Prepared 30-minute off-the-hour cadence (twice per 60m freshness threshold)
  # Do not activate until user approves the cadence.
  # schedule:
  #   - cron: '14,44 * * * *'

concurrency:
  group: collect-chargers
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: services/ingestion/package-lock.json

      - name: Install dependencies
        working-directory: services/ingestion
        run: npm ci

      - name: Reconstruct database certificate
        if: env.GROW_EV_DATABASE_CA != ''
        env:
          GROW_EV_DATABASE_CA: ${{ secrets.GROW_EV_DATABASE_CA }}
        run: |
          echo "$GROW_EV_DATABASE_CA" > /tmp/supabase-ca.crt

      - name: Run OCPI Collector
        working-directory: services/ingestion
        env:
          GROW_EV_DATABASE_URL: ${{ secrets.GROW_EV_DATABASE_URL }}
          GROW_EV_DATABASE_CA_FILE: /tmp/supabase-ca.crt
        run: npm run collect
        
      - name: Cleanup certificate
        if: always()
        run: rm -f /tmp/supabase-ca.crt

